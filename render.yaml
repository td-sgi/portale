# Render Blueprint - Portale SGI Toscana Diagnostica
# Deploy: New + > Blueprint > seleziona il repo GitHub. Render legge questo file e crea il servizio.
services:
  - type: web
    name: td-sgi-portale
    runtime: python
    plan: starter         # sempre acceso: necessario per i link SMS ai pazienti. (free = si addormenta dopo 15 min, primo accesso ~30 s)
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 60
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: SGI_USER
        value: sgi
      - key: CANONICAL_HOST
        sync: false            # impostare a mano in Render > Environment (sgi.toscanadiagnostica.it) SOLO dopo che il dominio risulta Verified; se attivo prima crea un loop di redirect
      - key: SGI_PASSWORD
        sync: false       # lasciare vuota = portale interamente pubblico (scelta AD 01/10/2026). Impostarla = area documentale protetta da password, Preparazioni sempre pubbliche.
